    <!-- Cache-Control is intentionally NOT set here.
         The Lovable CDN serves prerendered HTML from its edge nodes, and
         a "no-store" meta tag forces every visitor back to the origin —
         that alone pushes mobile TTFB above 3 s. Route-level cache
         behaviour is managed by hosting headers, not by this shell. -->

    <!-- viewport meta is set below with viewport-fit=cover for installable standalone mode -->
    <!--
      Subdomain lockdown for dashboard.mbacompass.in.
      Only /student/* and auth pages render on the dashboard host. Marketing
      sections (/mocks, /courses, /colleges, etc.) live on the main site and
      are NOT redirected — the two hosts operate independently.
    -->
    <script>
      // ── Canonical host enforcement ──
      // Always serve the non-www version of mbacompass.in. If a visitor (or
      // crawler that doesn't honor a server 301) lands on www.mbacompass.in,
      // redirect them to the apex domain immediately. location.replace keeps
      // it out of the back-button history and Googlebot treats it as a
      // permanent canonical signal alongside the rel=canonical tag.
      (function () {
        try {
          var h = window.location.hostname;
          if (h === "www.mbacompass.in") {
            var newUrl = "https://mbacompass.in" + window.location.pathname + window.location.search + window.location.hash;
            window.location.replace(newUrl);
            return;
          }
        } catch (e) { /* noop */ }
      })();
    </script>
    <script>
      (function () {
        try {
          var h = window.location.hostname;
          if (h !== "dashboard.mbacompass.in") return;
          var p = window.location.pathname;
          var s = window.location.search || "";
          var hh = window.location.hash || "";
          // Root URL "/" stays as the dashboard home. Other allowed prefixes also pass.
          if (p === "/" || p === "") return;
          var allowed = ["/student", "/auth", "/forgot-password", "/reset-password", "/formula", "/formulas", "/demo"];
          var ok = allowed.some(function (x) { return p === x || p.indexOf(x + "/") === 0; });
          if (!ok) {
            window.location.replace("https://dashboard.mbacompass.in/" + s + hh);
          }
        } catch (e) { /* noop */ }
      })();
    </script>
    <script>
      // ── Non-canonical host noindex ──
      // Any host other than the canonical apex (mbacompass.in / www) must NOT
      // be indexed by search engines: Lovable preview (*.lovable.app),
      // dashboard.mbacompass.in, and any future alias all serve the SAME
      // SPA bundle, which would otherwise create duplicate-content noise in
      // Google Search Console. We inject a hard noindex,nofollow meta into
      // the head BEFORE React mounts so crawlers that don't execute JS still
      // see the directive.
      (function () {
        try {
          var h = window.location.hostname;
          var canonical = (h === "mbacompass.in" || h === "www.mbacompass.in");
          if (canonical) return;
          var m = document.createElement("meta");
          m.setAttribute("name", "robots");
          m.setAttribute("content", "noindex, nofollow");
          document.head.appendChild(m);
          var g = document.createElement("meta");
          g.setAttribute("name", "googlebot");
          g.setAttribute("content", "noindex, nofollow");
          document.head.appendChild(g);
        } catch (e) { /* noop */ }
      })();
    </script>

    <!-- Preconnect to critical origins -->
    <link rel="preconnect" href="https://mttoiqruzzxooveooldo.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://mttoiqruzzxooveooldo.supabase.co" />
    <!--
      Parallel-fetch the critical JS chunks instead of waiting for each layer
      of imports to be discovered. Without this, the browser parses entry.js,
      then discovers react.js, then radix.js, then supabase.js etc. Each round
      trip costs latency on slower connections.
      The build emits hashed filenames; a tiny inline runtime walks <script type="module">
      links injected by Vite at build time and preloads the sibling chunks the
      entry imports. Falls back gracefully if anything is missing.
    -->
    <script>
      (function () {
        try {
          // Hint browser to set up TCP/TLS to its own origin in parallel with module parsing.
          var l = document.createElement('link');
          l.rel = 'preconnect';
          l.href = window.location.origin;
          document.head.appendChild(l);
        } catch (e) {}
      })();
    </script>
    <!-- Self-hosted web fonts. Preloaded with fetchpriority so the browser
         races them alongside the HTML/CSS instead of discovering them later
         via the stylesheet. `crossorigin` is required for font preloads even
         on same-origin, otherwise the browser refetches the file. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin="anonymous" fetchpriority="high" href="/fonts/dm-sans-400.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin="anonymous" fetchpriority="low" href="/fonts/plus-jakarta-sans-700.woff2" />
    <!-- Inline critical CSS for faster FP + mobile CLS hardening.
         `font-display: swap` guarantees text paints in the metric-matched
         fallback immediately — real fonts never block first render. The
         `size-adjust` fallbacks eliminate the layout shift on swap. -->
    <style>
      @font-face{font-family:"Plus Jakarta Sans";font-style:normal;font-weight:700;font-display:swap;src:url("/fonts/plus-jakarta-sans-700.woff2") format("woff2")}
      @font-face{font-family:"DM Sans";font-style:normal;font-weight:400;font-display:swap;src:url("/fonts/dm-sans-400.woff2") format("woff2")}
      @font-face{font-family:"Plus Jakarta Fallback";src:local("Arial");size-adjust:104%;ascent-override:94%;descent-override:24%;line-gap-override:0%}
      @font-face{font-family:"DM Sans Fallback";src:local("Arial");size-adjust:100%;ascent-override:96%;descent-override:24%;line-gap-override:0%}
      body{margin:0;font-family:'DM Sans','DM Sans Fallback',system-ui,-apple-system,sans-serif;background:#fff;color:#0f172a;-webkit-font-smoothing:antialiased;text-rendering:optimizeSpeed}
      /* Once the real webfonts are ready (or the 1.5s timeout fires) we drop
         the fallback stack. If the network is slow or fails, text stays
         readable in the metric-matched fallback forever — never invisible. */
      .fonts-loaded body{font-family:'DM Sans',system-ui,-apple-system,sans-serif}
      .fonts-loaded h1,.fonts-loaded h2,.fonts-loaded h3{font-family:'Plus Jakarta Sans',system-ui,sans-serif}
      #root{min-height:100vh}
      h1,h2,h3{font-family:'Plus Jakarta Sans','Plus Jakarta Fallback',system-ui,sans-serif;margin:0}
      /* Reserve hero space so the gradient block paints at the right height before JS hydrates. */
      main>section:first-of-type{min-height:520px}
      @media (min-width:768px){main>section:first-of-type{min-height:600px}}
      /* Reserved space for the initial page while React mounts. Intentionally
         NO full-screen overlay: Googlebot was seeing only the "Loading…"
         spinner on non-prerendered routes and flagging them as Soft 404.
         Real prerendered content in #root paints first now. */
    </style>
    <script>
      /* Font-loading race: whichever finishes first wins.
         - If document.fonts.ready resolves within 1500ms → add `.fonts-loaded`
           and swap from the metric-matched fallback to the real webfont.
         - If the network is slow or the font 404s, the timeout fires and we
           still add `.fonts-loaded` so we're not stuck in fallback forever —
           `font-display: swap` means the browser will paint the real font
           whenever it does arrive without blocking anything.
         Either way, first paint is never blocked on fonts. */
      (function(){
        var done = false;
        function ready(){ if(done) return; done = true; document.documentElement.classList.add('fonts-loaded'); }
        if (document.fonts && document.fonts.ready && typeof document.fonts.ready.then === 'function') {
          document.fonts.ready.then(ready).catch(ready);
        }
        setTimeout(ready, 1500);
      })();
    </script>

    <!-- JS-injected splash overlay. Crawlers without JS never see it (so it
         cannot cause Soft 404s on prerendered routes); real users see a
         branded loader instead of the unstyled prerender flash while React
         hydrates. Removed by main.tsx once <html class="app-mounted"> is set. -->
    <style>
      #__splash{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:linear-gradient(180deg,#eff6ff 0%,#dbeafe 60%,#bfdbfe 100%);transition:opacity .35s ease}
      html.app-mounted #__splash{opacity:0;pointer-events:none}
      #__splash .brand{font-family:'Plus Jakarta Sans','Plus Jakarta Fallback',system-ui,sans-serif;font-weight:800;font-size:22px;letter-spacing:-.02em;color:#0f172a}
      #__splash .brand span{background:linear-gradient(90deg,#2563eb,#0ea5e9);-webkit-background-clip:text;background-clip:text;color:transparent}
      #__splash .ring{width:38px;height:38px;border:3px solid #bfdbfe;border-top-color:#2563eb;border-radius:50%;animation:__spin .9s linear infinite}
      #__splash .tag{font-family:'DM Sans','DM Sans Fallback',system-ui,sans-serif;font-size:12px;color:#475569;letter-spacing:.02em}
      @keyframes __spin{to{transform:rotate(360deg)}}
    </style>
    <script>
      (function(){
        try{
          var d=document.createElement('div');
          d.id='__splash';
          d.setAttribute('aria-hidden','true');
          d.innerHTML='<div class="ring"></div><div class="brand">MBA <span>Compass</span></div><div class="tag">Loading…</div>';
          document.body.appendChild(d);
          var remove=function(){ if(d && d.parentNode) d.parentNode.removeChild(d); };
          var mo=new MutationObserver(function(){
            if(document.documentElement.classList.contains('app-mounted')){
              mo.disconnect();
              setTimeout(remove,400);
            }
          });
          mo.observe(document.documentElement,{attributes:true,attributeFilter:['class']});
          setTimeout(remove,9000);
        }catch(e){}
      })();
    </script>

    <!-- Google Analytics (GA4) — deferred to first meaningful user interaction
         (or idle fallback) so it never competes with LCP/INP on mobile.
         `mousemove` is intentionally excluded: it fires immediately when a
         desktop visitor's cursor is anywhere over the document, defeating
         the deferral. We also wrap the actual injection in
         requestIdleCallback so the third-party script never lands in the
         critical-path browser task. -->
    <script>
      (function () {
        var loaded = false;
        function injectGA() {
          if (loaded) return;
          loaded = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-QV79FTE0XN';
          document.head.appendChild(s);
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          window.gtag = gtag;
          gtag('js', new Date());
          gtag('config', 'G-QV79FTE0XN', { transport_type: 'beacon' });
        }
        function loadGA() {
          var idle = window.requestIdleCallback || function (cb) { return setTimeout(cb, 1); };
          idle(injectGA, { timeout: 2000 });
        }
        var events = ['pointerdown', 'touchstart', 'keydown', 'scroll'];
        function once() {
          events.forEach(function (e) { window.removeEventListener(e, once, { passive: true, capture: true }); });
          loadGA();
        }
        events.forEach(function (e) { window.addEventListener(e, once, { passive: true, capture: true }); });
        // Safety net: load anyway after 10s so bounces from idle visits are still counted.
        setTimeout(loadGA, 10000);
      })();
    </script>
