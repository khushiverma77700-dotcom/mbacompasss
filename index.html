<!doctype html>

    <meta charset="UTF-8" />
    <!-- Prevent browsers/proxies from serving a stale HTML shell after a deploy -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- viewport meta is set below with viewport-fit=cover for installable standalone mode -->
    <!--
      Subdomain lockdown for dashboard.mbacompass.in.
      Only /student/* and auth pages render on the dashboard host. Marketing
      sections (/mocks, /courses, /colleges, etc.) live on the main site and
      are NOT redirected — the two hosts operate independently.
    -->
    <script>
      // ── Canonical host enforcement ──
      // Always serve the non-www version of mbacompass.in. If a visitor (or
      // crawler that doesn't honor a server 301) lands on www.mbacompass.in,
      // redirect them to the apex domain immediately. location.replace keeps
      // it out of the back-button history and Googlebot treats it as a
      // permanent canonical signal alongside the rel=canonical tag.
      (function () {
        try {
          var h = window.location.hostname;
          if (h === "www.mbacompass.in") {
            var newUrl = "https://mbacompass.in" + window.location.pathname + window.location.search + window.location.hash;
            window.location.replace(newUrl);
            return;
          }
        } catch (e) { /* noop */ }
      })();
    </script>
    <script>
      (function () {
        try {
          var h = window.location.hostname;
          if (h !== "dashboard.mbacompass.in") return;
          var p = window.location.pathname;
          var s = window.location.search || "";
          var hh = window.location.hash || "";
          // Root URL "/" stays as the dashboard home. Other allowed prefixes also pass.
          if (p === "/" || p === "") return;
          var allowed = ["/student", "/auth", "/forgot-password", "/reset-password", "/formula", "/formulas", "/demo"];
          var ok = allowed.some(function (x) { return p === x || p.indexOf(x + "/") === 0; });
          if (!ok) {
            window.location.replace("https://dashboard.mbacompass.in/" + s + hh);
          }
        } catch (e) { /* noop */ }
      })();
    </script>
    <script>
      // ── Non-canonical host noindex ──
      // Any host other than the canonical apex (mbacompass.in / www) must NOT
      // be indexed by search engines: Lovable preview (*.lovable.app),
      // dashboard.mbacompass.in, and any future alias all serve the SAME
      // SPA bundle, which would otherwise create duplicate-content noise in
      // Google Search Console. We inject a hard noindex,nofollow meta into
      // the head BEFORE React mounts so crawlers that don't execute JS still
      // see the directive.
      (function () {
        try {
          var h = window.location.hostname;
          var canonical = (h === "mbacompass.in" || h === "www.mbacompass.in");
          if (canonical) return;
          var m = document.createElement("meta");
          m.setAttribute("name", "robots");
          m.setAttribute("content", "noindex, nofollow");
          document.head.appendChild(m);
          var g = document.createElement("meta");
          g.setAttribute("name", "googlebot");
          g.setAttribute("content", "noindex, nofollow");
          document.head.appendChild(g);
        } catch (e) { /* noop */ }
      })();
    </script>

    <!-- Preconnect to critical origins -->
    <link rel="preconnect" href="https://mttoiqruzzxooveooldo.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://mttoiqruzzxooveooldo.supabase.co" />
    <!--
      Parallel-fetch the critical JS chunks instead of waiting for each layer
      of imports to be discovered. Without this, the browser parses entry.js,
      then discovers react.js, then radix.js, then supabase.js etc. Each round
      trip costs latency on slower connections.
      The build emits hashed filenames; a tiny inline runtime walks <script type="module">
      links injected by Vite at build time and preloads the sibling chunks the
      entry imports. Falls back gracefully if anything is missing.
    -->
    <script>
      (function () {
        try {
          // Hint browser to set up TCP/TLS to its own origin in parallel with module parsing.
          var l = document.createElement('link');
          l.rel = 'preconnect';
          l.href = window.location.origin;
          document.head.appendChild(l);
        } catch (e) {}
      })();
    </script>

    <!-- Non-blocking web fonts: swap-in via media="print" trick so the first
         paint never waits on Google Fonts. Critical CSS already declares the
         system fallback so the H1 (LCP) renders immediately. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700&family=DM+Sans:wght@400&display=swap" onload="this.onload=null;this.rel='stylesheet'" />

    <!-- Inline critical CSS for faster FP + mobile CLS hardening.
         The @font-face fallbacks below use Chrome's size-adjust + override
         metrics so the system fallback matches Plus Jakarta / DM Sans
         dimensions. This eliminates the layout shift when the real web
         font swaps in (one of the biggest mobile CLS sources). -->
    <style>
      @font-face{font-family:"Plus Jakarta Fallback";src:local("Arial");size-adjust:104%;ascent-override:94%;descent-override:24%;line-gap-override:0%}
      @font-face{font-family:"DM Sans Fallback";src:local("Arial");size-adjust:100%;ascent-override:96%;descent-override:24%;line-gap-override:0%}
      body{margin:0;font-family:'DM Sans','DM Sans Fallback',system-ui,-apple-system,sans-serif;background:#fff;color:#0f172a;-webkit-font-smoothing:antialiased;text-rendering:optimizeSpeed}
      #root{min-height:100vh}
      h1,h2,h3{font-family:'Plus Jakarta Sans','Plus Jakarta Fallback',system-ui,sans-serif;margin:0}
      /* Reserve hero space so the gradient block paints at the right height before JS hydrates. */
      main>section:first-of-type{min-height:520px}
      @media (min-width:768px){main>section:first-of-type{min-height:600px}}
      /* Minimal neutral loader painted before React mounts — disappears the moment the app mounts. */
      #app-shell{position:fixed;inset:0;z-index:1;background:#ffffff;display:flex;align-items:center;justify-content:center;pointer-events:none}
      #app-shell .shell-inner{display:flex;flex-direction:column;align-items:center;gap:14px;color:#475569;font-family:'DM Sans',system-ui,sans-serif}
      #app-shell .shell-spinner{width:34px;height:34px;border-radius:50%;border:3px solid #e0f2fe;border-top-color:#0ea5e9;animation:shell-spin .8s linear infinite}
      #app-shell .shell-brand{font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-weight:700;font-size:14px;letter-spacing:.02em;color:#0f172a}
      #app-shell .shell-tag{font-size:12px;opacity:.7;margin:0}
      @keyframes shell-spin{to{transform:rotate(360deg)}}
      .app-mounted #app-shell{display:none}
    </style>

    <!-- Google Analytics (GA4) — deferred to first meaningful user interaction
         (or idle fallback) so it never competes with LCP/INP on mobile.
         `mousemove` is intentionally excluded: it fires immediately when a
         desktop visitor's cursor is anywhere over the document, defeating
         the deferral. We also wrap the actual injection in
         requestIdleCallback so the third-party script never lands in the
         critical-path browser task. -->
    <script>
      (function () {
        var loaded = false;
        function injectGA() {
          if (loaded) return;
          loaded = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-QV79FTE0XN';
          document.head.appendChild(s);
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          window.gtag = gtag;
          gtag('js', new Date());
          gtag('config', 'G-QV79FTE0XN', { transport_type: 'beacon' });
        }
        function loadGA() {
          var idle = window.requestIdleCallback || function (cb) { return setTimeout(cb, 1); };
          idle(injectGA, { timeout: 2000 });
        }
        var events = ['pointerdown', 'touchstart', 'keydown', 'scroll'];
        function once() {
          events.forEach(function (e) { window.removeEventListener(e, once, { passive: true, capture: true }); });
          loadGA();
        }
        events.forEach(function (e) { window.addEventListener(e, once, { passive: true, capture: true }); });
        // Safety net: load anyway after 10s so bounces from idle visits are still counted.
        setTimeout(loadGA, 10000);
      })();
    </script>
