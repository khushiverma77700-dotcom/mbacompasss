    <!-- viewport meta is set below with viewport-fit=cover for installable standalone mode -->
    <!--
      Subdomain lockdown for dashboard.mbacompass.in.
      Only /student/* and auth pages render on the dashboard host. Marketing
      sections (/mocks, /courses, /colleges, etc.) live on the main site and
      are NOT redirected — the two hosts operate independently.
    -->
    <script>
      // ── Canonical host enforcement ──
      // Always serve the non-www version of mbacompass.in. If a visitor (or
      // crawler that doesn't honor a server 301) lands on www.mbacompass.in,
      // redirect them to the apex domain immediately. location.replace keeps
      // it out of the back-button history and Googlebot treats it as a
      // permanent canonical signal alongside the rel=canonical tag.
      (function () {
        try {
          var h = window.location.hostname;
          if (h === "www.mbacompass.in") {
            var newUrl = "https://mbacompass.in" + window.location.pathname + window.location.search + window.location.hash;
            window.location.replace(newUrl);
            return;
          }
        } catch (e) { /* noop */ }
      })();
    </script>
    <script>
      (function () {
        try {
          var h = window.location.hostname;
          if (h !== "dashboard.mbacompass.in") return;
          var p = window.location.pathname;
          var s = window.location.search || "";
          var hh = window.location.hash || "";
          // Root URL "/" stays as the dashboard home. Other allowed prefixes also pass.
          if (p === "/" || p === "") return;
          var allowed = ["/student", "/auth", "/forgot-password", "/reset-password"];
          var ok = allowed.some(function (x) { return p === x || p.indexOf(x + "/") === 0; });
          if (!ok) {
            window.location.replace("https://dashboard.mbacompass.in/" + s + hh);
          }
        } catch (e) { /* noop */ }
      })();
    </script>

    <!-- Preconnect to critical origins -->
    <link rel="preconnect" href="https://mttoiqruzzxooveooldo.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://mttoiqruzzxooveooldo.supabase.co" />
    <!--
      Parallel-fetch the critical JS chunks instead of waiting for each layer
      of imports to be discovered. Without this, the browser parses entry.js,
      then discovers react.js, then radix.js, then supabase.js etc. Each round
      trip costs latency on slower connections.
      The build emits hashed filenames; a tiny inline runtime walks <script type="module">
      links injected by Vite at build time and preloads the sibling chunks the
      entry imports. Falls back gracefully if anything is missing.
    -->
    <script>
      (function () {
        try {
          // Hint browser to set up TCP/TLS to its own origin in parallel with module parsing.
          var l = document.createElement('link');
          l.rel = 'preconnect';
          l.href = window.location.origin;
          document.head.appendChild(l);
        } catch (e) {}
      })();
    </script>
